<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Baby ✨</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0b020c;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        #hearts-container {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 1; overflow: hidden;
        }
        .heart {
            position: absolute; color: #ff4d6d; opacity: 0.7;
            animation: fall linear forwards;
        }
        @keyframes fall {
            to { transform: translateY(105vh); opacity: 0; }
        }
        .container {
            width: 90%; max-width: 450px; padding: 25px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            z-index: 10;
            position: relative;
        }
        h1 { font-size: 1.8rem; color: #ff4d6d; margin-bottom: 15px; text-shadow: 0 0 10px rgba(255,77,109,0.3); }
        p { font-size: 1rem; line-height: 1.6; color: #f0e6ef; margin-bottom: 20px; }
        .btn {
            background: linear-gradient(45deg, #ff4d6d, #ff758f);
            color: white; border: none; padding: 12px 28px;
            font-size: 1rem; border-radius: 50px; cursor: pointer;
            font-weight: bold; transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4);
        }
        .btn:hover { transform: scale(1.05); box-shadow: 0 6px 20px rgba(255, 77, 109, 0.6); }
        .love-card img {
            width: 100%; max-height: 300px; object-fit: cover;
            border-radius: 15px; margin-bottom: 15px;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        
        /* Gaya Kad Magik */
        .magic-zone { display: none; opacity: 0; transition: opacity 0.5s ease; }
        .card-container {
            display: grid; grid-template-columns: repeat(2, 1fr);
            gap: 15px; margin: 20px 0; perspective: 1000px;
        }
        .magic-card {
            width: 100%; height: 140px; cursor: pointer;
            position: relative; transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .magic-card.flipped { transform: rotateY(180deg); }
        .card-front, .card-back {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 12px;
            display: flex; justify-content: center; align-items: center;
            padding: 10px; font-size: 0.9rem; font-weight: bold;
        }
        .card-front {
            background: linear-gradient(135deg, #4a00e0, #8e2de2);
            border: 2px solid #ff758f; color: #fff;
        }
        .card-back {
            background: #250938; border: 2px solid #ff4d6d;
            color: #ff758f; transform: rotateY(180deg);
        }

        /* SCREEN INTERAKTIF BUNGA API (Dibaiki sepenuhnya) */
        #fireworks-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #050107; z-index: 9999; 
            display: none;
        }
        .fw-instruction {
            position: absolute; top: 40px; width: 100%; text-align: center;
            color: #ff758f; font-size: 1.2rem; font-weight: bold;
            text-shadow: 0 0 10px rgba(255,117,143,0.5);
            pointer-events: none; padding: 0 20px;
            z-index: 10000;
        }

        /* Tulisan Letupan Huruf */
        .fw-letter {
            position: absolute;
            font-size: 3.5rem;
            font-weight: 900;
            color: #ff4d6d;
            text-shadow: 0 0 20px #ff758f, 0 0 30px #ff4d6d;
            transform: translate(-50%, -50%) scale(0);
            animation: popOut 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            pointer-events: none;
            z-index: 99999;
        }
