<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Special Space ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Kontainer untuk Efek Hati Gugur -->
    <div class="hearts-container" id="hearts-container"></div>

    <!-- HALAMAN PERTAMA (Intro) -->
    <div id="intro-screen">
        <h1 class="main-title">Hey Beautiful, Happy Birthday! ✨</h1>
        <p class="click-hint">I made something special for you. Click below to open it...</p>
        <button class="enter-btn" onclick="nextPage()">Open Surprise 🎁</button>
    </div>

    <!-- HALAMAN KEDUA (Surprise + Gambar) -->
    <div id="main-content">
        <h2>Reasons Why I Love You 🥰</h2>
        
        <div class="card">
            <!-- Ruang Gambar Memori Korang -->
            <div class="img-container">
                <img id="love-image" src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=500" alt="Our Memory">
            </div>
            
            <p id="reason-text">Click the button below to see a reason...</p>
            <button class="enter-btn" onclick="generateReason()">Next Reason ❤️</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
