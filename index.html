<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Special Space ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HALAMAN PERTAMA (Intro) -->
    <div id="intro-screen">
        <h1 class="main-title">Hey Baby, Happy Birthday! ✨</h1>
        <p class="click-hint">I made something small for you. Tekan sini babyyy...</p>
        <button class="enter-btn" onclick="nextPage()">Open Surprise 🎁</button>
    </div>

    <!-- HALAMAN KEDUA (Isi Kandungan/Surprise) -->
    <div id="main-content">
        <h2>Reasons Why I Love You 🥰</h2>
        
        <div class="card">
            <p id="reason-text">Tekan sini babyy below to see a reason...</p>
            <button class="enter-btn" onclick="generateReason()">Next Reason ❤️</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
